name: Deploy and Sync

on:
  push:
    branches:
      - main

jobs:
  deploy-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Hashes Sync Scripts
        uses: actions/cache@v4
        with:
          path: .sync/scripts/cache/cache-hash.json
          key: sync-scripts-hash-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sync-scripts-hash-${{ runner.os }}

      - name: Cache Hashes Sync Manifests
        uses: actions/cache@v4
        with:
          path: .sync/manifests/cache/cache-hash.json
          key: sync-manifests-hash-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sync-manifests-hash-${{ runner.os }}

      - name: Cache Hashes Sync Assets
        uses: actions/cache@v4
        with:
          path: .sync/assets/cache/cache-hash.json
          key: sync-assets-hash-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sync-assets-hash-${{ runner.os }}

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            API_KEY
            R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            BUCKET_PUBLIC_NAME
            BUCKET_PRIVATE_NAME
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BUCKET_PUBLIC_NAME: ${{ vars.BUCKET_PUBLIC_NAME }}
          BUCKET_PRIVATE_NAME: ${{ vars.BUCKET_PRIVATE_NAME  }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Wait for Cloudflare Routing
        run: sleep 60

      - name: Compile PowerShell Scripts
        shell: pwsh
        run: |
          ./scripts/compile.ps1

      - name: Build and Sync to R2
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ vars.API_URL  }}
          BUCKET_PUBLIC_NAME: ${{ vars.BUCKET_PUBLIC_NAME }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          node .sync/index.js
